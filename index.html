<meta charset="utf-8">
<title>VanSpot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: warm sand page, one bold green hero panel with an illustrated road scene, then calm full-width bands.
   Palette follows the VanSpot brand: green #075B4B, orange #FF8A00, charcoal #1F2937, sand #F5EFE4. */
:root{
  --bg:#F5EFE4; --surface:#FFFBF3; --fg:#1F2937; --muted:#566070; --line:#DDD3C0;
  --brand:#075B4B; --brand-ink:#FFFFFF; --brand-text:#075B4B;
  --orange:#FF8A00; --orange-ink:#1F2937;
  --s-gray:#9AA3AF; --s-green:#2E9E5B; --s-amber:#F5A300; --s-red:#D64545;
  --sky:#FBE3BC; --hill-a:#0A6F5B; --hill-b:#075B4B; --hill-c:#04483C; --road:#2B3440;
  --font-he:'Heebo',system-ui,sans-serif; --font-en:'Montserrat','Heebo',system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1C19; --surface:#15302A; --fg:#F3EEE3; --muted:#A8B7B1; --line:#27463F;
  --brand:#075B4B; --brand-text:#5FD3B6; --sky:#294A41; --hill-a:#0F7A63; --hill-b:#0A5F4E; --hill-c:#06463A; --road:#0B1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C19; --surface:#15302A; --fg:#F3EEE3; --muted:#A8B7B1; --line:#27463F;
  --brand:#075B4B; --brand-text:#5FD3B6; --sky:#294A41; --hill-a:#0F7A63; --hill-b:#0A5F4E; --hill-c:#06463A; --road:#0B1412; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-he);font-size:17px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[lang="en"] body{font-family:var(--font-en)}
html[lang="en"] body{font-weight:500}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}

/* header */
header.top{display:flex;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Montserrat',sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;direction:ltr;color:var(--fg)}
.logo svg{width:30px;height:30px}
.logo b{color:var(--brand-text);font-weight:800}
nav.main{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:15px}
nav.main a:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.lang{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:17px}
.btn-primary{background:var(--orange);color:var(--orange-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-ghost[aria-disabled="true"]{opacity:.7;cursor:default}
.btn[aria-disabled="true"]{cursor:default}

/* hero */
.hero{background:var(--brand);color:#fff;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch}
.hero .copy{padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;gap:20px;justify-content:center;min-width:0}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#FFD08A}
html[lang="he"] .eyebrow{letter-spacing:0;text-transform:none;font-size:15px}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:#E4F1EC;max-width:36em}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.hero .scene{min-height:300px;position:relative}
.hero .scene svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:14px;color:#BFDDD3}

/* countdown strip */
.strip{margin-block:18px 0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.strip .days{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;color:var(--brand-text);line-height:1;font-variant-numeric:tabular-nums}
.strip p{flex:1;min-width:220px}
.strip small{display:block;color:var(--muted);font-size:14px}

section{padding-block:clamp(44px,7vw,84px)}
.kick{font-weight:800;color:var(--brand-text);font-size:15px;margin-bottom:10px}
h2{font-size:clamp(28px,4vw,42px);font-weight:800;max-width:20em}
.sub{color:var(--muted);max-width:40em;margin-top:14px;font-size:18px}

/* audiences: staggered, not a card grid */
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
.aud article{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.aud article:nth-child(2){transform:translateY(18px)}
.aud h3{font-size:22px;font-weight:800}
.aud p{color:var(--muted)}
.aud svg{width:46px;height:46px}

/* pin states */
.how{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.states{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.states li{display:flex;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;min-width:0}
.states .pin{flex:none;width:34px;height:34px}
.states b{display:block;font-size:18px}
.states span{color:var(--muted);font-size:15px}
.rules{margin-top:22px;display:flex;flex-direction:column;gap:10px;padding:0;list-style:none}
.rules li{padding-inline-start:26px;position:relative;color:var(--fg)}
.rules li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--orange)}

/* difference band */
.band{background:var(--fg);color:#F3EEE3;border-radius:28px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{background:#15302A}}
:root[data-theme="dark"] .band{background:#15302A}
.band h2{color:#fff}
.band p{color:#D6DEDA;margin-top:14px;font-size:18px;max-width:34em}
.il{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(30px,5vw,54px);line-height:1;color:var(--orange);direction:ltr;text-align:center}
.il small{display:block;font-family:inherit;font-size:14px;font-weight:600;color:#BFDDD3;margin-top:10px;letter-spacing:.04em}

/* screenshots */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.phone{aspect-ratio:9/19;max-width:100%;border:2px dashed var(--line);border-radius:30px;background:var(--surface);display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:15px}
.phone.shot{padding:0;border:1.5px solid var(--line);overflow:hidden;box-shadow:0 14px 30px -18px rgba(0,0,0,.45)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:inherit;display:block}

/* beta */
.beta{background:var(--orange);color:var(--orange-ink);border-radius:28px;padding:clamp(28px,5vw,56px);display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.beta h2{max-width:14em}
.beta p{margin-top:10px;max-width:32em;font-size:18px}
.btn-dark{background:var(--fg);color:#fff}
:root[data-theme="dark"] .btn-dark{background:#0E1C19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-dark{background:#0E1C19}}
.stores{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;gap:8px;align-items:center;border:1.5px solid rgba(31,41,55,.45);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}

/* support & legal pages */
.page h1{font-size:clamp(32px,5vw,50px);font-weight:800;margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:34px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:23px}
.card p,.card li{color:var(--muted)}
.card ul{margin:0;padding-inline-start:20px}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mail{direction:ltr;unicode-bidi:plaintext;font-weight:700;font-family:'Montserrat',sans-serif;word-break:break-all;color:var(--fg)}
.small-btn{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.legal-links{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;background:transparent;color:var(--fg)}
.pill[aria-disabled="true"]{color:var(--muted);border-style:dashed}
.disclaimer{margin-top:34px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:24px}
.disclaimer h2{font-size:22px;margin-bottom:10px}
.disclaimer ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.back{display:inline-block;font-weight:700;text-decoration:none;color:var(--brand-text);margin-top:10px}


/* download page */
.dl-hero{margin-top:26px;background:var(--brand);color:#fff;border-radius:28px;padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;position:relative;overflow:hidden}
.dl-hero h2{color:#fff;max-width:16em}
.dl-hero p{color:#D6EBE4;max-width:34em}
.dl-btn{position:relative;display:inline-flex;align-items:center;gap:14px;background:var(--orange);color:var(--orange-ink);font:inherit;font-weight:800;font-size:clamp(24px,5vw,34px);padding:22px 44px;border-radius:22px;border:0;cursor:pointer;text-decoration:none;box-shadow:0 10px 0 #B85F00,0 22px 40px -12px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.dl-btn:hover{transform:translateY(2px);box-shadow:0 8px 0 #B85F00,0 18px 34px -12px rgba(0,0,0,.5)}
.dl-btn:active{transform:translateY(8px);box-shadow:0 2px 0 #B85F00,0 8px 16px -8px rgba(0,0,0,.5)}
.dl-btn svg{width:34px;height:34px}
.dl-btn[aria-disabled="true"]{background:#C9BFAB;box-shadow:0 10px 0 #9C927D;cursor:default;color:#4a4636}
.dl-meta{display:flex;gap:10px 22px;flex-wrap:wrap;justify-content:center;color:#BFDDD3;font-size:15px}
.dl-meta b{color:#fff}
.hash{direction:ltr;unicode-bidi:plaintext;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all;color:#BFDDD3;max-width:100%}
.warn{margin-top:26px;border:2px solid var(--s-amber);border-radius:var(--r);background:var(--surface);padding:22px 24px}
.warn h2{font-size:21px;margin-bottom:10px}
.warn ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.steps{margin:26px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.steps li{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.steps b{font-size:19px}
.steps span{color:var(--muted);font-size:15.5px}
.conf{position:fixed;top:-12px;width:10px;height:16px;border-radius:2px;pointer-events:none;z-index:50;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}

footer{padding-block:40px 56px;color:var(--muted);font-size:14px;border-top:1.5px solid var(--line);margin-top:30px;display:flex;flex-direction:column;gap:12px}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
footer a{font-weight:700;text-decoration:none;color:var(--fg)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero .scene{min-height:230px;order:-1}
  .aud,.shots,.cards,.how,.band{grid-template-columns:1fr}
  .aud article:nth-child(2){transform:none}
  .shots{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .phone{border-radius:18px;padding:8px;font-size:12px}
  .phone img{border-radius:16px}
}
@media (prefers-reduced-motion:no-preference){
  .scene .van{animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3px)}}
}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#home" aria-label="VanSpot">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C9.9 2 5 6.8 5 12.8 5 20.6 16 30 16 30s11-9.4 11-17.2C27 6.8 22.1 2 16 2z" fill="#075B4B"/><circle cx="16" cy="12.5" r="5" fill="#FF8A00"/></svg>
      <span>Van<b>Spot</b></span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#how" data-k="nav_how"></a>
      <a href="#beta" data-k="nav_beta"></a>
      <a href="#download" data-k="nav_dl"></a>
      <a href="#support" data-k="nav_support"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Language"></button>
    </nav>
  </header>

  <!-- HOME -->
  <main id="view-home" data-view="home">
    <div class="hero">
      <div class="copy">
        <div class="eyebrow" data-k="eyebrow"></div>
        <h1 data-k="h1"></h1>
        <p class="lead" data-k="lead"></p>
        <div class="actions">
          <a class="btn btn-primary" id="waBtn" href="#beta" data-k="cta_beta"></a>
          <span class="btn btn-ghost" aria-disabled="true" data-k="cta_store"></span>
        </div>
        <p class="note" data-k="hero_note"></p>
      </div>
      <div class="scene" aria-hidden="true">
        <svg viewBox="90 0 420 460" preserveAspectRatio="xMidYMax slice">
          <rect width="600" height="460" fill="var(--sky)"/>
          <circle cx="440" cy="120" r="58" fill="#FF8A00"/>
          <circle cx="440" cy="120" r="84" fill="#FF8A00" opacity=".18"/>
          <path d="M0 300 C90 220 170 250 260 290 C350 330 430 200 600 250 L600 460 L0 460Z" fill="var(--hill-a)"/>
          <path d="M0 340 C110 280 220 330 330 320 C430 310 500 280 600 310 L600 460 L0 460Z" fill="var(--hill-b)"/>
          <path d="M0 395 C150 360 300 400 600 372 L600 460 L0 460Z" fill="var(--hill-c)"/>
          <path d="M0 425 L600 400 L600 460 L0 460Z" fill="var(--road)"/>
          <path d="M20 440 L110 436 M170 434 L260 430 M320 428 L410 424 M470 422 L560 418" stroke="#F5EFE4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
          <!-- status pins on the hills -->
          <g transform="translate(120 255)"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-green)"/><circle cx="0" cy="18" r="6" fill="#fff"/></g>
          <g transform="translate(300 262) scale(.8)"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-amber)"/><circle cx="0" cy="18" r="6" fill="#fff"/></g>
          <g transform="translate(488 252) scale(.8)"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-gray)"/><circle cx="0" cy="18" r="6" fill="#fff"/></g>
          <!-- van -->
          <g class="van" transform="translate(190 318)">
            <ellipse cx="130" cy="108" rx="140" ry="9" fill="#000" opacity=".25"/>
            <path d="M10 40 Q10 10 40 10 L190 10 Q222 10 238 52 L252 76 Q258 88 248 96 L18 96 Q10 96 10 88Z" fill="#F5EFE4"/>
            <path d="M10 66 L252 66 L256 80 Q258 90 248 96 L18 96 Q10 96 10 88Z" fill="#FF8A00"/>
            <path d="M196 18 L214 18 Q226 18 232 34 L240 56 L196 56Z" fill="#1F2937"/>
            <rect x="34" y="24" width="58" height="32" rx="6" fill="#1F2937"/>
            <rect x="104" y="24" width="58" height="32" rx="6" fill="#1F2937"/>
            <rect x="170" y="30" width="2.5" height="62" fill="#1F2937" opacity=".25"/>
            <circle cx="58" cy="98" r="19" fill="#1F2937"/><circle cx="58" cy="98" r="8" fill="#9AA3AF"/>
            <circle cx="200" cy="98" r="19" fill="#1F2937"/><circle cx="200" cy="98" r="8" fill="#9AA3AF"/>
            <rect x="244" y="70" width="10" height="8" rx="3" fill="#FFD08A"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="strip" id="strip">
      <div class="days" id="days">--</div>
      <p><span data-k="strip_txt"></span><small data-k="strip_small"></small></p>
    </div>

    <section aria-labelledby="aud-h">
      <div class="kick" data-k="aud_kick"></div>
      <h2 id="aud-h" data-k="aud_h"></h2>
      <div class="aud">
        <article>
          <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="3" y="3" width="40" height="40" rx="12" fill="var(--brand)"/><path d="M12 28h22v-6l-4-6H15l-3 6z" fill="#F5EFE4"/><circle cx="17" cy="30" r="3" fill="#FF8A00"/><circle cx="30" cy="30" r="3" fill="#FF8A00"/></svg>
          <h3 data-k="a1_h"></h3><p data-k="a1_p"></p>
        </article>
        <article>
          <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="3" y="3" width="40" height="40" rx="12" fill="#FF8A00"/><path d="M12 31 23 14l11 17z" fill="#1F2937"/><path d="M19 31l4-6 4 6z" fill="#FF8A00"/></svg>
          <h3 data-k="a2_h"></h3><p data-k="a2_p"></p>
        </article>
        <article>
          <svg viewBox="0 0 46 46" aria-hidden="true"><rect x="3" y="3" width="40" height="40" rx="12" fill="#1F2937"/><circle cx="17" cy="19" r="4" fill="#FF8A00"/><circle cx="29" cy="19" r="4" fill="#F5EFE4"/><path d="M11 32c1-5 5-7 6-7s5 2 6 7zM23 32c1-5 5-7 6-7s5 2 6 7z" fill="#F5EFE4" opacity=".9"/></svg>
          <h3 data-k="a3_h"></h3><p data-k="a3_p"></p>
        </article>
      </div>
    </section>

    <section id="how" aria-labelledby="how-h">
      <div class="how">
        <div>
          <div class="kick" data-k="how_kick"></div>
          <h2 id="how-h" data-k="how_h"></h2>
          <p class="sub" data-k="how_sub"></p>
          <ul class="rules">
            <li data-k="r1"></li><li data-k="r2"></li><li data-k="r3"></li><li data-k="r4"></li>
          </ul>
        </div>
        <ul class="states">
          <li><svg class="pin" viewBox="-20 -2 40 54" aria-hidden="true"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-green)"/><circle cy="18" r="6" fill="#fff"/></svg><div><b data-k="s_green"></b><span data-k="s_green_t"></span></div></li>
          <li><svg class="pin" viewBox="-20 -2 40 54" aria-hidden="true"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-amber)"/><circle cy="18" r="6" fill="#fff"/></svg><div><b data-k="s_amber"></b><span data-k="s_amber_t"></span></div></li>
          <li><svg class="pin" viewBox="-20 -2 40 54" aria-hidden="true"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-red)"/><circle cy="18" r="6" fill="#fff"/></svg><div><b data-k="s_red"></b><span data-k="s_red_t"></span></div></li>
          <li><svg class="pin" viewBox="-20 -2 40 54" aria-hidden="true"><path d="M0 0c-10 0-18 8-18 18 0 13 18 30 18 30s18-17 18-30c0-10-8-18-18-18z" fill="var(--s-gray)"/><circle cy="18" r="6" fill="#fff"/></svg><div><b data-k="s_gray"></b><span data-k="s_gray_t"></span></div></li>
        </ul>
      </div>
    </section>

    <div class="band">
      <div>
        <h2 data-k="diff_h"></h2>

  var b=this,t=T[lang];
  function done(){b.textContent=t.copied;setTimeout(function(){b.textContent=t.copy},1500)}
  try{navigator.clipboard.writeText(CFG.SUPPORT_EMAIL).then(done,function(){})}catch(e){}
});

/* views via hash: home (default), support. Other hashes scroll to a section on home. */
var views=['home','support','download'];
function route(){
  var h=(location.hash||'').slice(1), show='home', anchor=null;
  if(h==='support') show='support';
  else if(h==='download') show='download';
  else if(h&&h!=='home') anchor=h;
  views.forEach(function(v){document.getElementById('view-'+v).hidden=(v!==show)});
  if(anchor){var el=document.getElementById(anchor); if(el){el.scrollIntoView({behavior:'smooth',block:'start'});return;}}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* countdown */
function countdown(){
  var t=new Date(CFG.LAUNCH_WINK+'T00:00:00'), n=new Date(), s=document.getElementById('strip');
  var days=Math.ceil((t-n)/86400000);
  if(isNaN(days)||days<0){s.hidden=true;return;}
  document.getElementById('days').textContent=days;
}

lang=detect(); applyLang(); route(); countdown();
})();
